services:
  sehatai-voice-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sehatai-voice-companion
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=hackathon-demo
      # Optional keys: SehatAI boots and runs cleanly with zero API keys set
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    restart: unless-stopped
